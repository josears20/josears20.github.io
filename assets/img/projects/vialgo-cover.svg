<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <!-- Portada ilustrada de VialGo (la captura real se muestra al abrir el proyecto) -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#071a3a"/><stop offset=".55" stop-color="#11508f"/><stop offset="1" stop-color="#7fe3ff"/></linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#e9fbff"/><stop offset=".35" stop-color="#7fe3ff" stop-opacity=".7"/><stop offset="1" stop-color="#7fe3ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="m1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b4f7e"/><stop offset="1" stop-color="#0f2f52"/></linearGradient>
    <linearGradient id="m2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#123a63"/><stop offset="1" stop-color="#0a2340"/></linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d3a4a"/><stop offset="1" stop-color="#05121c"/></linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a4256"/><stop offset="1" stop-color="#151a26"/></linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5a5f"/><stop offset="1" stop-color="#b3151f"/></linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ff1ff"/><stop offset="1" stop-color="#29b6e6"/></linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ce1ff" stop-opacity="0"/><stop offset="1" stop-color="#5ce1ff" stop-opacity=".9"/></linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="1200" height="750" fill="url(#sky)"/>
  <g fill="#fff" opacity=".7"><circle cx="120" cy="80" r="1.6"/><circle cx="260" cy="40" r="1.2"/><circle cx="420" cy="110" r="1.4"/><circle cx="880" cy="60" r="1.6"/><circle cx="1040" cy="120" r="1.2"/><circle cx="1130" cy="40" r="1.4"/></g>
  <circle cx="620" cy="350" r="190" fill="url(#sun)"/>
  <!-- Montañas low-poly -->
  <path d="M0 380l120-110 90 60 130-140 120 120 80-50 140 110 120-130 150 120 110-70 120 90v170H0z" fill="url(#m1)"/>
  <path d="M340 230l-40 60 70-20zM900 240l-30 50 60-10z" fill="#e6f4ff" opacity=".85"/>
  <path d="M0 430l160-80 120 60 160-90 170 110 150-70 170 90 140-60 130 60v120H0z" fill="url(#m2)"/>
  <rect y="440" width="1200" height="310" fill="url(#grass)"/>
  <!-- Carretera -->
  <path d="M590 440h30c80 90 260 200 520 310H60c240-110 450-220 530-310z" fill="url(#road)"/>
  <path d="M590 440c-80 90-290 200-530 310M620 440c80 90 260 200 520 310" fill="none" stroke="#eef6ff" stroke-width="5"/>
  <g fill="#ffd166"><path d="M603 450h4l2 22h-8z"/><path d="M600 492h10l4 40h-18z"/><path d="M594 560h22l8 72h-38z"/><path d="M586 660h38l10 90H576z"/></g>
  <!-- Estelas de luz -->
  <path d="M520 750c30-80 60-150 85-200" stroke="url(#trail)" stroke-width="10" fill="none" filter="url(#blur)" opacity=".7"/>
  <path d="M700 750c-30-80-60-150-80-200" stroke="url(#trail)" stroke-width="10" fill="none" filter="url(#blur)" opacity=".7"/>
  <!-- Coche visto desde atrás -->
  <g transform="translate(600 610)">
    <ellipse cx="0" cy="70" rx="150" ry="18" fill="#000" opacity=".45"/>
    <path d="M-130 40c0-30 20-50 50-56l20-44c6-12 16-18 30-18h60c14 0 24 6 30 18l20 44c30 6 50 26 50 56v24c0 10-8 16-18 16h-224c-10 0-18-6-18-16z" fill="url(#car)"/>
    <path d="M-62-6l16-36c4-8 10-12 20-12h52c10 0 16 4 20 12l16 36z" fill="#0b1626"/>
    <path d="M-50-12l12-26h32z" fill="#5ce1ff" opacity=".35"/>
    <rect x="-118" y="14" width="56" height="16" rx="8" fill="#ffe1e3"/><rect x="62" y="14" width="56" height="16" rx="8" fill="#ffe1e3"/>
    <rect x="-118" y="14" width="56" height="16" rx="8" fill="#ff3b4b" opacity=".6" filter="url(#blur)"/><rect x="62" y="14" width="56" height="16" rx="8" fill="#ff3b4b" opacity=".6" filter="url(#blur)"/>
    <rect x="-34" y="30" width="68" height="20" rx="4" fill="#eef6ff"/><text x="0" y="45" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="13" font-weight="700" fill="#0b1626">VIALGO</text>
    <rect x="-128" y="64" width="40" height="22" rx="6" fill="#0b0f18"/><rect x="88" y="64" width="40" height="22" rx="6" fill="#0b0f18"/>
  </g>
  <!-- Señales -->
  <g transform="translate(905 470)">
    <rect x="-4" y="0" width="8" height="120" fill="#9aa3b5"/>
    <circle cx="0" cy="-20" r="40" fill="#fff" stroke="#e63946" stroke-width="10"/>
    <text x="0" y="-6" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="36" font-weight="800" fill="#0b1626">50</text>
  </g>
  <g transform="translate(300 480)">
    <rect x="-4" y="0" width="8" height="110" fill="#9aa3b5"/>
    <polygon points="-16.6,-60 16.6,-60 40,-36.6 40,-3.4 16.6,20 -16.6,20 -40,-3.4 -40,-36.6" fill="#e63946" stroke="#fff" stroke-width="5"/>
    <text x="0" y="-12" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="19" font-weight="800" fill="#fff">STOP</text>
  </g>
  <!-- Insignia de nivel -->
  <g transform="translate(980 180)">
    <circle r="78" fill="#5ce1ff" opacity=".22" filter="url(#blur)"/>
    <path d="M-62-10c-30-10-40-40-30-60 20 10 30 30 30 60zM62-10c30-10 40-40 30-60-20 10-30 30-30 60z" fill="#7fe3ff" opacity=".85"/>
    <circle r="56" fill="url(#badge)" stroke="#e9fbff" stroke-width="5"/>
    <text y="18" text-anchor="middle" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="58" font-weight="700" fill="#fff">3</text>
    <rect x="-56" y="40" width="112" height="30" rx="8" fill="#0b1626"/>
    <text y="61" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="800" letter-spacing="3" fill="#e9fbff">NIVEL</text>
    <g fill="#ffd166" stroke="#fff" stroke-width="2"><path d="M-70 98l7 14 15 2-11 10 3 15-14-7-14 7 3-15-11-10 15-2z"/><path d="M0 92l9 18 20 3-15 13 4 20-18-9-18 9 4-20-15-13 20-3z"/><path d="M70 98l7 14 15 2-11 10 3 15-14-7-14 7 3-15-11-10 15-2z"/></g>
  </g>
  <!-- Logo -->
  <g transform="translate(70 120)">
    <text font-family="Space Grotesk, Segoe UI, sans-serif" font-size="104" font-weight="700" letter-spacing="-3" fill="#fff">Vial<tspan fill="#5ce1ff">Go</tspan></text>
    <text y="46" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="600" letter-spacing="6" fill="#cdeeff">EDUCACIÓN VIAL EN 3D</text>
  </g>
  <!-- HUD -->
  <g transform="translate(70 230)" font-family="Inter, Segoe UI, sans-serif">
    <rect width="250" height="64" rx="16" fill="#06111f" fill-opacity=".7" stroke="#5ce1ff" stroke-opacity=".5"/>
    <circle cx="32" cy="32" r="14" fill="none" stroke="#4ade80" stroke-width="3"/><path d="M25 32l5 5 9-10" fill="none" stroke="#4ade80" stroke-width="3"/>
    <text x="58" y="28" font-size="12" font-weight="700" letter-spacing="2" fill="#5ce1ff">MISIÓN</text>
    <text x="58" y="48" font-size="17" font-weight="600" fill="#fff">Cede el paso</text>
  </g>
</svg>
