<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <!-- INTRAS 2024 · Editor de Unity con la escena 3D de ESCOLA y un script en C# -->
  <defs><clipPath id="sceneClip"><rect x="260" y="112" width="620" height="352" rx="0"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121524"/><stop offset="1" stop-color="#07080d"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a88c7"/><stop offset="1" stop-color="#a9c6e8"/></linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cb365"/><stop offset="1" stop-color="#5b8f4c"/></linearGradient>
    <linearGradient id="wallL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3efe6"/><stop offset="1" stop-color="#cfc6b6"/></linearGradient>
    <linearGradient id="wallR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9d0bf"/><stop offset="1" stop-color="#a99f8d"/></linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <!-- Ventana del editor -->
  <rect x="30" y="30" width="1140" height="690" rx="18" fill="#1e1f22" stroke="#fff" stroke-opacity=".08"/>
  <rect x="30" y="30" width="1140" height="44" rx="18" fill="#2a2b2f"/><rect x="30" y="56" width="1140" height="18" fill="#2a2b2f"/>
  <g fill="#c8c8c8"><path d="M560 44l14 9-14 9z"/><rect x="590" y="44" width="5" height="18"/><rect x="600" y="44" width="5" height="18"/><path d="M620 44l10 9-10 9zM630 44h4v18h-4z"/></g>
  <text x="60" y="58" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#c8c8c8">ESCOLA · Unity</text>

  <!-- Jerarquía -->
  <rect x="40" y="84" width="210" height="380" rx="8" fill="#282828"/>
  <text x="56" y="108" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#9a9a9a">Hierarchy</text>
  <g font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#d6d6d6">
    <text x="56" y="140">▾ Escena_Colegio</text>
    <text x="76" y="168">Edificio</text><text x="76" y="196">PasoDePeatones</text>
    <rect x="44" y="208" width="202" height="24" rx="4" fill="#2c5d87"/><text x="76" y="225" fill="#fff">Nino_Peaton</text>
    <text x="76" y="252">Coche</text><text x="76" y="280">SenalPeligro</text><text x="76" y="308">Main Camera</text><text x="76" y="336">Directional Light</text>
  </g>

  <!-- Vista de escena -->
  <rect x="260" y="84" width="620" height="380" rx="8" fill="url(#sky)"/>
  <rect x="260" y="84" width="620" height="28" rx="8" fill="#323232"/>
  <text x="276" y="103" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#d6d6d6">Scene</text><text x="336" y="103" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#8a8a8a">Game</text>
  <g clip-path="url(#sceneClip)">
  <path d="M570 270l170 98-170 98-170-98z" fill="#5d6470"/>
  <g fill="#fff"><path d="M520 372l22-12 50 28-22 12z"/><path d="M556 351l22-12 50 28-22 12z"/><path d="M592 330l22-12 50 28-22 12z"/></g>
  <!-- edificio -->
  <path d="M470 250l120 70v-80l-120-70z" fill="url(#wallR)" transform="translate(-60 -30)"/>
  <path d="M410 220l-100 58v-80l100-58z" fill="url(#wallL)"/>
  <path d="M410 140l120 70-100 58-120-70z" fill="#d4573a"/>
  <g fill="#3f6fa5"><path d="M330 220l26-15v24l-26 15zM370 196l26-15v24l-26 15z"/><path d="M430 206l26 15v24l-26-15zM480 236l26 15v24l-26-15z"/></g>
  <!-- niño con gizmo -->
  <g transform="translate(640 360)">
    <circle cx="0" cy="-30" r="10" fill="#f2c9a0"/><rect x="-9" y="-20" width="18" height="30" rx="8" fill="#ffad7a"/>
    <rect x="-12" y="-18" width="8" height="18" rx="4" fill="#3b82f6"/>
    <path d="M0 -10V-80" stroke="#4ade80" stroke-width="4"/><path d="M-6 -78l6-14 6 14z" fill="#4ade80"/>
    <path d="M0 -10H70" stroke="#ef4444" stroke-width="4"/><path d="M68 -16l14 6-14 6z" fill="#ef4444"/>
    <path d="M0 -10l-50 28" stroke="#3b82f6" stroke-width="4"/><path d="M-52 12l-10 12 4-16z" fill="#3b82f6"/>
  </g>
  <!-- coche -->
  <g transform="translate(470 420)"><path d="M0 0l60-34 40 23-60 34z" fill="#ef4444"/><path d="M14 -6l34-20 22 13-34 20z" fill="#1f2937"/><circle cx="18" cy="18" r="7" fill="#111"/><circle cx="74" cy="-12" r="7" fill="#111"/></g>
  <!-- señal -->
  <rect x="770" y="300" width="5" height="60" fill="#6b7280"/><path d="M772 262l24 42h-48z" fill="#facc15" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
  <text x="772" y="298" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800" fill="#111">!</text>

  </g>
  <rect x="890" y="84" width="270" height="380" rx="8" fill="#282828"/>
  <text x="906" y="108" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#9a9a9a">Inspector</text>
  <g font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#d6d6d6">
    <text x="906" y="140" font-weight="600" fill="#fff">Nino_Peaton</text>
    <rect x="900" y="154" width="250" height="1" fill="#3a3a3a"/>
    <text x="906" y="178">Transform</text>
    <g fill="#9a9a9a" font-size="12"><text x="906" y="202">Position</text><text x="986" y="202">X 4.2</text><text x="1036" y="202">Y 0</text><text x="1076" y="202">Z -1.5</text></g>
    <rect x="900" y="218" width="250" height="1" fill="#3a3a3a"/>
    <text x="906" y="244" fill="#5ce1ff"># PeatonController (Script)</text>
    <g fill="#9a9a9a" font-size="12"><text x="906" y="270">Velocidad</text><text x="1040" y="270">1.2</text><text x="906" y="294">Detectar peligro</text><rect x="1040" y="282" width="14" height="14" rx="3" fill="#2c5d87"/><text x="906" y="318">Zona escolar</text><text x="1040" y="318">Activa</text></g>
    <rect x="900" y="334" width="250" height="1" fill="#3a3a3a"/>
    <text x="906" y="360">Animator</text><text x="906" y="388">Rigidbody</text>
  </g>

  <!-- Código C# -->
  <rect x="40" y="476" width="1120" height="234" rx="8" fill="#18191c"/>
  <text x="56" y="500" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#9a9a9a">PeatonController.cs</text>
  <g font-family="JetBrains Mono, Consolas, monospace" font-size="17">
    <text x="56" y="536"><tspan fill="#569cd6">public class</tspan><tspan fill="#4ec9b0"> PeatonController</tspan><tspan fill="#d4d4d4"> : </tspan><tspan fill="#4ec9b0">MonoBehaviour</tspan></text>
    <text x="56" y="562" fill="#d4d4d4">{</text>
    <text x="90" y="588"><tspan fill="#569cd6">public float</tspan><tspan fill="#9cdcfe"> velocidad</tspan><tspan fill="#d4d4d4"> = </tspan><tspan fill="#b5cea8">1.2f</tspan><tspan fill="#d4d4d4">;</tspan></text>
    <text x="90" y="614"><tspan fill="#569cd6">void</tspan><tspan fill="#dcdcaa"> OnTriggerEnter</tspan><tspan fill="#d4d4d4">(</tspan><tspan fill="#4ec9b0">Collider</tspan><tspan fill="#9cdcfe"> otro</tspan><tspan fill="#d4d4d4">) {</tspan></text>
    <text x="124" y="640"><tspan fill="#c586c0">if</tspan><tspan fill="#d4d4d4"> (otro.</tspan><tspan fill="#dcdcaa">CompareTag</tspan><tspan fill="#d4d4d4">(</tspan><tspan fill="#ce9178">"Vehiculo"</tspan><tspan fill="#d4d4d4">)) </tspan><tspan fill="#dcdcaa">RegistrarReaccion</tspan><tspan fill="#d4d4d4">();</tspan></text>
    <text x="90" y="666" fill="#d4d4d4">}</text>
    <text x="56" y="692" fill="#d4d4d4">}</text>
  </g>
  <rect x="980" y="640" width="160" height="40" rx="20" fill="#5ce1ff" fill-opacity=".12" stroke="#5ce1ff" stroke-opacity=".5"/>
  <text x="1060" y="666" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="15" fill="#eef1f7">Unity · C#</text>
</svg>
